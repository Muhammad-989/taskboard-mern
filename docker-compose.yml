services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.runCommand({ ping: 1 }).ok\" | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongodb:27017/taskboard
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CLIENT_URL: http://localhost:5173
      COOKIE_SECURE: "false"
    ports:
      - "4000:4000"
    depends_on:
      mongodb:
        condition: service_healthy

  client:
    build:
      context: ./client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongodb_data:
